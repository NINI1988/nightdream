name: Android CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build noGmsRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Unit Tests (noGmsRelease)
        run: ./gradlew testNoGmsReleaseUnitTest

      - name: Build APK (noGmsRelease)
        run: ./gradlew assembleNoGmsRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nightdream-noGms-release
          path: app/build/outputs/apk/noGms/release/*.apk
          retention-days: 14
